plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id "legacy-looming" version "1.10-SNAPSHOT"
    id 'maven-publish'
}

base.archivesName = project.mod_id
version = project.mod_version
group = project.maven_group

repositories {}

legacyLooming {}

loom {
    runs {
        client {
            programArgs "--userProperties", "{}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings legacy.yarn(project.minecraft_version, project.yarn_build)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:${project.fabric_version}"
    modRuntimeOnly files("libs/MopMenu-1.0.6.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = 8
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}