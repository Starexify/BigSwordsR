plugins {
  id 'maven-publish'
  id 'fabric-loom' version '1.17-SNAPSHOT'
  id 'ploceus' version '1.17-SNAPSHOT'
}

sourceSets.main.resources {
  srcDir('src/generated/resources')

  exclude("**/*.bbmodel")
  exclude("src/generated/**/.cache")
}

base {
  archivesName = project.mod_id
}

version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

ploceus {
  setIntermediaryGeneration(2)
}

repositories {}

loom {
  accessWidenerPath = file("src/main/resources/big_swords.classtweaker")

  runs {
    client {
      programArguments.addAll "--userProperties", "{}"
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  exceptions ploceus.raven(project.raven_build)
  signatures ploceus.sparrow(project.sparrow_build)
  nests ploceus.nests(project.nests_build)
  mappings ploceus.featherMappings(project.feather_build)

  ploceus.dependOsl(project.osl_version)
}

processResources {
  inputs.property 'version', version

  filesMatching('fabric.mod.json') {
    expand 'version': version
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = 'UTF-8'
  it.options.release = 25
}

tasks.configureEach { task ->
  if (task.name in ["processResources", "compileJava", "sourcesJar"]) {
    task.doFirst {
      file('src/generated/resources').mkdirs()
    }
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25

  withSourcesJar()
}

jar {
  from('LICENSE') {
    rename { "${it}_${base.archivesName.get()}" }
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }

  repositories {}
}

tasks.register('runDatagen', JavaExec) {
  group = "build"
  workingDir = file("build/datagen")
  doFirst { workingDir.mkdirs() }

  classpath = sourceSets.main.runtimeClasspath
  mainClass = "net.nova.big_swords.data.DataGenerator"

  args '--output', file('src/generated/resources').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
}