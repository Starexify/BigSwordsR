modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json"

displayURL="https://github.com/Starexify/BigSwordsR"
issueTrackerURL="https://github.com/Starexify/BigSwordsR/issues"
logoFile= "../../resources/big_swords_r_logo.png"
#credits=""
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties.modmenu]
links=["big_swords.modrinth=modrinth.com/mod/big-swords-r", "big_swords.curseforge=www.curseforge.com/minecraft/mc-mods/big-swords-r", "big_swords.wiki=https://github.com/Starexify/BigSwordsR/wiki"]
sources="https://github.com/Starexify/BigSwordsR"

[[mixins]]
config="big_swords.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
